<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Materiales - Elio Orozco</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #1E3A8A;
            padding-bottom: 20px;
        }
        
        .header h1 {
            color: #1E3A8A;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab-button {
            padding: 12px 20px;
            border: none;
            background: #f0f0f0;
            color: #333;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .tab-button:hover {
            background: #e0e0e0;
        }
        
        .tab-button.active {
            background: #1E3A8A;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .input-field {
            display: flex;
            flex-direction: column;
        }
        
        label {
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="number"],
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        
        .result-box.show {
            display: block;
        }
        
        .result-title {
            color: #1E3A8A;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .result-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .result-table th {
            background: #1E3A8A;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
        
        .result-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .result-table tr:hover {
            background: #f5f5f5;
        }
        
        .download-btn {
            background: #28a745;
            margin-top: 15px;
            width: 100%;
        }
        
        .download-btn:hover {
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        
        .success {
            color: #28a745;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .input-row {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab-button {
                border-radius: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ Calculadora de Materiales</h1>
            <p>Elaborado por Elio Orozco</p>
        </div>
        
        <div class="input-group">
            <div class="input-row">
                <div class="input-field">
                    <label for="proyecto">Nombre del Proyecto</label>
                    <input type="text" id="proyecto" value="Muro Perimetral">
                </div>
                <div class="input-field">
                    <label for="cliente">Cliente / Propietario</label>
                    <input type="text" id="cliente" value="Cliente General">
                </div>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab-button active" onclick="cambiarTab(0)">🧱 Pared de Bloques</button>
            <button class="tab-button" onclick="cambiarTab(1)">🪨 Piedra Cantera</button>
            <button class="tab-button" onclick="cambiarTab(2)">🥣 Concreto Estructural</button>
            <button class="tab-button" onclick="cambiarTab(3)">⛓️ Acero de Refuerzo</button>
        </div>
        
        <!-- TAB 1: BLOQUES -->
        <div id="tab0" class="tab-content active">
            <div class="input-row">
                <div class="input-field">
                    <label for="largo_b">Largo (m)</label>
                    <input type="number" id="largo_b" value="10.0" step="0.1">
                </div>
                <div class="input-field">
                    <label for="alto_b">Alto (m)</label>
                    <input type="number" id="alto_b" value="2.5" step="0.1">
                </div>
                <div class="input-field">
                    <label for="desp_b">Desperdicio (%)</label>
                    <input type="number" id="desp_b" value="5" step="0.1">
                </div>
            </div>
            <div class="button-group">
                <button onclick="calcularBloques()">Calcular Bloques</button>
            </div>
            <div id="resultado_b" class="result-box"></div>
        </div>
        
        <!-- TAB 2: CANTERA -->
        <div id="tab1" class="tab-content">
            <div class="input-row">
                <div class="input-field">
                    <label for="largo_c">Largo (m)</label>
                    <input type="number" id="largo_c" value="5.0" step="0.1">
                </div>
                <div class="input-field">
                    <label for="alto_c">Alto (m)</label>
                    <input type="number" id="alto_c" value="2.75" step="0.1">
                </div>
                <div class="input-field">
                    <label for="desp_c">Desperdicio (%)</label>
                    <input type="number" id="desp_c" value="5" step="0.1">
                </div>
            </div>
            <div class="button-group">
                <button onclick="calcularCantera()">Calcular Cantera</button>
            </div>
            <div id="resultado_c" class="result-box"></div>
        </div>
        
        <!-- TAB 3: CONCRETO -->
        <div id="tab2" class="tab-content">
            <div class="input-row">
                <div class="input-field">
                    <label for="volumen_conc">Volumen total (m³)</label>
                    <input type="number" id="volumen_conc" value="0.88" step="0.01">
                </div>
                <div class="input-field">
                    <label for="proporcion_conc">Proporción / Resistencia</label>
                    <select id="proporcion_conc">
                        <option value="1:2:2.5|8.94|0.60|0.76">1:2:2.5 (3000 PSI)</option>
                        <option value="1:2:3|8.23|0.555|0.835" selected>1:2:3 (2800 PSI)</option>
                        <option value="1:2.5:4|6.58|0.555|0.89">1:2.5:4 (2000 PSI)</option>
                        <option value="1:3:3|7.05|0.715|0.715">1:3:3 (1800 PSI)</option>
                        <option value="1:3:4|6.11|0.625|0.835">1:3:4 (1500 PSI)</option>
                    </select>
                </div>
            </div>
            <div class="button-group">
                <button onclick="calcularConcreto()">Calcular Concreto</button>
            </div>
            <div id="resultado_conc" class="result-box"></div>
        </div>
        
        <!-- TAB 4: ACERO -->
        <div id="tab3" class="tab-content">
            <div class="input-row">
                <div class="input-field">
                    <label for="longitud_a">Longitud total del elemento (m)</label>
                    <input type="number" id="longitud_a" value="12.0" step="0.1">
                </div>
                <div class="input-field">
                    <label for="varillas_a">Varillas longitudinales en sección</label>
                    <input type="number" id="varillas_a" value="4" step="1">
                </div>
                <div class="input-field">
                    <label for="diametro_a">Diámetro del acero</label>
                    <select id="diametro_a">
                        <option value="0.249|0.5489">N2 (1/4)</option>
                        <option value="0.590|1.3007">N3 (3/8)</option>
                        <option value="0.994|2.1913" selected>N4 (1/2)</option>
                        <option value="1.552|3.4215">N5 (5/8)</option>
                        <option value="2.235|4.9272">N6 (3/4)</option>
                    </select>
                </div>
            </div>
            <div class="button-group">
                <button onclick="calcularAcero()">Calcular Acero</button>
            </div>
            <div id="resultado_a" class="result-box"></div>
        </div>
        
        <div class="footer">
            <p>💡 <strong>Nota importante:</strong> Se recomienda el acompañamiento de un especialista en la construcción para toda obra civil.</p>
        </div>
    </div>
    
    <script>
        function cambiarTab(index) {
            // Ocultar todos los tabs
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // Desactivar todos los botones
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Mostrar tab activo
            document.getElementById('tab' + index).classList.add('active');
            buttons[index].classList.add('active');
        }
        
        function calcularBloques() {
            const proyecto = document.getElementById('proyecto').value;
            const cliente = document.getElementById('cliente').value;
            const largo = parseFloat(document.getElementById('largo_b').value);
            const alto = parseFloat(document.getElementById('alto_b').value);
            const desp = parseFloat(document.getElementById('desp_b').value);
            
            const area_m2 = largo * alto;
            const factor = 1 + (desp / 100);
            const bloques = Math.round(area_m2 * 12.5 * factor);
            const cemento = Math.round(area_m2 * 0.25 * factor * 10) / 10;
            const arena = Math.round(area_m2 * 0.025 * factor * 100) / 100;
            const arena_yd3 = Math.round(arena * 1.30795 * 100) / 100;
            
            mostrarResultado('resultado_b', 'ESTIMACIÓN: MAMPOSTERÍA DE BLOQUE', [
                ['Material / Insumo', 'Cantidad', 'Unidad'],
                ['Bloques (12x20x40 cm)', bloques.toString(), 'Unidades'],
                ['Cemento (Mortero pegado)', cemento.toString(), 'Bolsas (42.5 kg)'],
                ['Arena fina', arena.toString() + ' m³', arena_yd3.toString() + ' Yardas³']
            ]);
        }
        
        function calcularCantera() {
            const proyecto = document.getElementById('proyecto').value;
            const cliente = document.getElementById('cliente').value;
            const largo = parseFloat(document.getElementById('largo_c').value);
            const alto = parseFloat(document.getElementById('alto_c').value);
            const desp = parseFloat(document.getElementById('desp_c').value);
            
            const area_m2 = largo * alto;
            const factor = 1 + (desp / 100);
            const piedras = Math.round(area_m2 * 4.17 * factor);
            const cemento = Math.round(area_m2 * 0.18 * factor * 10) / 10;
            const arena = Math.round(area_m2 * 0.03 * factor * 100) / 100;
            
            mostrarResultado('resultado_c', 'ESTIMACIÓN: PIEDRA CANTERA', [
                ['Material / Insumo', 'Cantidad', 'Unidad'],
                ['Piedras Canteras (0.40x0.60m)', piedras.toString(), 'Unidades'],
                ['Cemento (Pegado)', cemento.toString(), 'Bolsas (42.5 kg)'],
                ['Arena', arena.toString() + ' m³', 'Metros Cúbicos']
            ]);
        }
        
        function calcularConcreto() {
            const volumen = parseFloat(document.getElementById('volumen_conc').value);
            const prop_select = document.getElementById('proporcion_conc').value;
            const [label, cemento_d, arena_d, piedrin_d] = prop_select.split('|');
            
            const cemento = Math.round(volumen * parseFloat(cemento_d) * 10) / 10;
            const arena = Math.round(volumen * parseFloat(arena_d) * 100) / 100;
            const piedrin = Math.round(volumen * parseFloat(piedrin_d) * 100) / 100;
            const bidones_arena = Math.round(arena / 0.02);
            const bidones_piedrin = Math.round(piedrin / 0.02);
            
            mostrarResultado('resultado_conc', 'DOSIFICACIÓN DE CONCRETO', [
                ['Insumo (Dosificación)', 'Cantidad', 'Equivalente en Bidones'],
                ['Cemento (Sacos 42.5 kg)', cemento.toString(), 'Sacos'],
                ['Arena', arena.toString() + ' m³', bidones_arena.toString() + ' Bidones'],
                ['Piedrín', piedrin.toString() + ' m³', bidones_piedrin.toString() + ' Bidones']
            ]);
        }
        
        function calcularAcero() {
            const longitud = parseFloat(document.getElementById('longitud_a').value);
            const varillas = parseFloat(document.getElementById('varillas_a').value);
            const dia_select = document.getElementById('diametro_a').value;
            const [kg_m, lb_m] = dia_select.split('|');
            
            const long_total = longitud * varillas;
            const peso_lb = Math.round(long_total * parseFloat(lb_m) * 100) / 100;
            const qq = Math.round((peso_lb / 100) * 100) / 100;
            const varillas_6m = Math.round((long_total / 6) * 10) / 10;
            
            mostrarResultado('resultado_a', 'CÁLCULO DE ACERO DE REFUERZO', [
                ['Concepto Acero', 'Cantidad', 'Unidad'],
                ['Longitud total requerida', long_total.toString(), 'Metros'],
                ['Peso total estimado', peso_lb.toString() + ' lbs', qq.toString() + ' Quintales'],
                ['Varillas de 6m aproximadas', varillas_6m.toString(), 'Varillas']
            ]);
        }
        
        function mostrarResultado(elementId, titulo, datos) {
            const elemento = document.getElementById(elementId);
            let html = `<div class="result-title">✅ ${titulo}</div>`;
            html += '<table class="result-table"><thead><tr>';
            
            // Headers
            for (let i = 0; i < datos[0].length; i++) {
                html += `<th>${datos[0][i]}</th>`;
            }
            html += '</tr></thead><tbody>';
            
            // Datos
            for (let i = 1; i < datos.length; i++) {
                html += '<tr>';
                for (let j = 0; j < datos[i].length; j++) {
                    html += `<td>${datos[i][j]}</td>`;
                }
                html += '</tr>';
            }
            
            html += '</tbody></table>';
            elemento.innerHTML = html;
            elemento.classList.add('show');
        }
    </script>
</body>
</html>
