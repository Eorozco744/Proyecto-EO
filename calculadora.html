<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Materiales - Ing. Elio Orozco</title>
  
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #1f2a44;
      --secondary: #f5f7ff;
      --success: #198754;
      --warning: #f59e0b;
      --text: #1f2937;
      --bg-start: #667eea;
      --bg-end: #764ba2;
      --card-bg: rgba(255,255,255,0.96);
      --muted: #475569;
    }

    body {
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      padding: 20px 0;
    }

    body.dark {
      --primary: #8b5cf6;
      --primary-dark: #e6eefc;
      --secondary: #0f172a;
      --success: #16a34a;
      --warning: #f59e0b;
      --text: #e6eefc;
      --bg-start: #0f172a;
      --bg-end: #041528;
      --card-bg: rgba(10, 14, 23, 0.85);
      --muted: #9ca3af;
    }

    .card-shadow {
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      border: none;
      border-radius: 1rem;
      background: var(--card-bg);
    }

    .header-title {
      font-weight: 700;
      color: var(--primary-dark);
    }

    .subheader {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .tab-button {
      border-radius: 999px !important;
      padding: 0.7rem 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-button.active {
      background: linear-gradient(135deg, var(--primary), #7c3aed) !important;
      color: white !important;
      border-color: transparent !important;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 0.9rem;
      padding: 1.25rem;
    }

    .form-label {
      font-weight: 600;
      color: var(--primary-dark);
      font-size: 0.9rem;
    }

    .form-control, .form-select {
      border-radius: 0.7rem;
      border: 1px solid #dbeafe;
      background: #fff;
      padding: 0.7rem 0.9rem;
    }

    body.dark .form-control, body.dark .form-select {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
    }

    .form-control:focus, .form-select:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.15);
    }

    .result-box {
      border-radius: 1rem;
      background: linear-gradient(135deg, #f8fafc, #eef2ff);
      border: 1px solid #dfe7ff;
      padding: 1rem;
      margin-top: 1rem;
    }

    body.dark .result-box {
      background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.08);
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.8rem;
    }

    .result-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: white;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .table th, .table td {
      vertical-align: middle;
      font-size: 0.92rem;
    }

    .badge-soft {
      background: rgba(79, 70, 229, 0.1);
      color: #4338ca;
      padding: 0.4rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
    }

    body.dark .badge-soft {
      background: rgba(139, 92, 246, 0.2);
      color: #c084fc;
    }

      background: #f8fafc;
